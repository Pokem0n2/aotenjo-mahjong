[package]
name = "qingyun-mahjong"
version = "0.1.0"
description = "青云之志 - 雀魂Roguelike麻将复刻"
authors = ["Pokem0n2"]
edition = "2021"

[lib]
name = "qingyun_mahjong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
